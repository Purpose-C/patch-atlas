name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw test
      - run: ./mvnw spotbugs:check checkstyle:check
      - uses: actions/upload-artifact@v4
        with:
          name: jacoco-default
          path: target/jacoco-default.exec

  backend-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw test -Dgroups=database
      - uses: actions/upload-artifact@v4
        with:
          name: jacoco-database
          path: target/jacoco-database.exec

  coverage-report:
    runs-on: ubuntu-latest
    needs: [backend, backend-database]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          name: jacoco-default
          path: target
      - uses: actions/download-artifact@v4
        with:
          name: jacoco-database
          path: target
      - run: ./mvnw -DskipTests jacoco:merge jacoco:report
      - uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
