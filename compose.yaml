name: patchatlas

services:
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_DB: patchatlas
      POSTGRES_USER: patchatlas
      POSTGRES_PASSWORD: patchatlas
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patchatlas -d patchatlas"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: persistence
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/patchatlas
      SPRING_DATASOURCE_USERNAME: patchatlas
      SPRING_DATASOURCE_PASSWORD: patchatlas
      PATCHATLAS_WORKER_ENABLED: "false"
      PATCHATLAS_GENERATOR_TYPE: FAKE
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/api/v1/health"]
      interval: 5s
      timeout: 5s
      start_period: 40s
      retries: 24
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
