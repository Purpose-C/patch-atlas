spring:
  application:
    name: patch-atlas
  # 默认排除 JDBC/Flyway，无 PostgreSQL 时可启动（健康检查、本地开发）。
  # 启用持久化：SPRING_PROFILES_ACTIVE=persistence
  #   + SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
  # persistence profile 会清空 exclude 并开启 Flyway；见下方文档。
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
      # Spring AI OpenAI 自动装配会在缺 key 时失败；OPENAI 由 GeneratorConfiguration 显式创建
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration

logging:
  structured:
    format:
      console: logstash

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

---
# 激活后：DataSource + 事务 + Flyway 自动配置生效，Run Store 可装配。
spring:
  config:
    activate:
      on-profile: persistence
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  flyway:
    enabled: true
    locations: classpath:db/migration

# Worker 默认关闭；启用示例：
#   patchatlas.worker.enabled=true
#   patchatlas.worker.workspace-root=/var/patchatlas/workspaces
# 项目会装配 Docker Sandbox、共享预热 Replay 与 RunReplayer；可用自定义 Bean 覆盖 adapter。
#
# 生成器：默认 FAKE（CI）；OPENAI 需环境变量注入密钥与模型（绝不明文写 key）
#   OPENAI_API_KEY
#   PATCHATLAS_OPENAI_MODEL
#   PATCHATLAS_OPENAI_BASE_URL（可选；仍强制原生 JSON Schema）
patchatlas:
  locating:
    max-tool-calls: 35
    wall-clock: 9m
  worker:
    enabled: false
    # poll-interval: 2s   # 常驻消费空队列间隔（仅 worker.enabled=true）
  generator:
    type: FAKE
    openai:
      model: ${PATCHATLAS_OPENAI_MODEL:}
      base-url: ${PATCHATLAS_OPENAI_BASE_URL:https://api.openai.com}
      vendor: ${PATCHATLAS_OPENAI_VENDOR:openai}
  observability:
    pricing:
      provider: ${PATCHATLAS_PRICING_PROVIDER:}
      model: ${PATCHATLAS_PRICING_MODEL:}
      input-usd-per-million-tokens: ${PATCHATLAS_PRICING_INPUT_USD_PER_MILLION_TOKENS:}
      output-usd-per-million-tokens: ${PATCHATLAS_PRICING_OUTPUT_USD_PER_MILLION_TOKENS:}
      effective-date: ${PATCHATLAS_PRICING_EFFECTIVE_DATE:}
      source: ${PATCHATLAS_PRICING_SOURCE:}
